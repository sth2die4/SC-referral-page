<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a2040"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>
    <radialGradient id="planet" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8a6018"/>
      <stop offset="60%" stop-color="#4a3010"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="rgba(200,146,42,0)"/>
      <stop offset="50%" stop-color="rgba(200,146,42,0.6)"/>
      <stop offset="100%" stop-color="rgba(200,146,42,0)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g1)"/>
  <!-- Stars -->
  <g fill="#e8f0f8">
    <circle cx="80" cy="60" r="0.8" opacity="0.7"/>
    <circle cx="200" cy="100" r="1.2" opacity="0.8"/>
    <circle cx="350" cy="40" r="0.6" opacity="0.5"/>
    <circle cx="500" cy="120" r="1" opacity="0.7"/>
    <circle cx="650" cy="60" r="0.9" opacity="0.6"/>
    <circle cx="750" cy="180" r="1.3" opacity="0.9"/>
    <circle cx="100" cy="350" r="0.7" opacity="0.5"/>
    <circle cx="300" cy="450" r="1.1" opacity="0.7"/>
    <circle cx="700" cy="400" r="0.8" opacity="0.6"/>
  </g>
  <!-- Planet -->
  <circle cx="600" cy="380" r="180" fill="url(#planet)" opacity="0.85"/>
  <ellipse cx="600" cy="380" rx="260" ry="30" fill="url(#ring)" transform="rotate(-15 600 380)"/>
  <!-- Ship silhouette -->
  <g transform="translate(250,260)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="100" ry="14" fill="rgba(0,168,232,0.4)"/>
    <polygon points="0,-50 30,-8 0,-12 -30,-8" fill="rgba(0,168,232,0.5)"/>
    <rect x="-18" y="-10" width="36" height="18" rx="3" fill="rgba(0,168,232,0.6)"/>
    <ellipse cx="0" cy="2" rx="14" ry="5" fill="rgba(200,146,42,0.8)"/>
  </g>
  <!-- Nebula -->
  <ellipse cx="200" cy="200" rx="250" ry="100" fill="rgba(0,80,180,0.15)"/>
  <ellipse cx="500" cy="100" rx="300" ry="80" fill="rgba(100,0,150,0.1)"/>
  <text x="400" y="470" font-family="Orbitron, sans-serif" font-size="9" fill="rgba(200,146,42,0.5)" letter-spacing="3" text-anchor="middle">STAR CITIZEN</text>
</svg>
