<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="avBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5d75"/>
      <stop offset="50%" stop-color="#1f2a3a"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="avG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(100,200,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(100,200,255,0)"/>
    </radialGradient>
    <filter id="avglow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <g transform="translate(300,160)">
    <!-- Twin engine glow -->
    <circle cx="160" cy="-35" r="35" fill="url(#avG)"/>
    <circle cx="160" cy="35" r="35" fill="url(#avG)"/>
    <!-- Main fuselage (heavy/wide) -->
    <path d="M -250,-35 L -120,-65 L 100,-60 L 170,-30 L 195,0 L 170,30 L 100,60 L -120,65 L -250,35 Z" fill="url(#avBody)" stroke="rgba(200,146,42,0.55)" stroke-width="1.4"/>
    <!-- Heavy armor plates -->
    <path d="M -200,-50 L -80,-80 L 60,-80 L 130,-55 L 100,-55 L -180,-50 Z" fill="rgba(35,48,68,1)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <path d="M -200,50 L -80,80 L 60,80 L 130,55 L 100,55 L -180,50 Z" fill="rgba(35,48,68,1)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <!-- Cockpit -->
    <path d="M 40,-30 L 110,-30 L 145,-12 L 145,12 L 110,30 L 40,30 Z" fill="rgba(0,180,255,0.45)" stroke="rgba(0,220,255,0.85)" stroke-width="1.2"/>
    <ellipse cx="90" cy="-10" rx="35" ry="6" fill="rgba(180,230,255,0.7)"/>
    <!-- Forward gun -->
    <rect x="180" y="-4" width="30" height="8" fill="rgba(20,28,40,1)" stroke="rgba(200,146,42,0.5)" stroke-width="0.8"/>
    <circle cx="210" cy="0" r="3" fill="rgba(255,80,80,0.9)" filter="url(#avglow)"/>
    <!-- Twin engines -->
    <rect x="125" y="-55" width="50" height="40" rx="5" fill="rgba(18,25,38,1)" stroke="rgba(200,146,42,0.55)" stroke-width="1"/>
    <rect x="125" y="15" width="50" height="40" rx="5" fill="rgba(18,25,38,1)" stroke="rgba(200,146,42,0.55)" stroke-width="1"/>
    <circle cx="160" cy="-35" r="9" fill="rgba(100,210,255,1)" filter="url(#avglow)"/>
    <circle cx="160" cy="35" r="9" fill="rgba(100,210,255,1)" filter="url(#avglow)"/>
    <!-- Wing tips -->
    <polygon points="-100,-65 -200,-95 -240,-75 -180,-55" fill="rgba(30,42,60,0.95)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <polygon points="-100,65 -200,95 -240,75 -180,55" fill="rgba(30,42,60,0.95)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <!-- Wing weapons -->
    <rect x="-220" y="-85" width="20" height="5" fill="rgba(20,28,40,1)"/>
    <rect x="-220" y="80" width="20" height="5" fill="rgba(20,28,40,1)"/>
    <!-- Panel lines -->
    <line x1="-200" y1="-15" x2="100" y2="-15" stroke="rgba(200,146,42,0.25)" stroke-width="0.5"/>
    <line x1="-200" y1="15" x2="100" y2="15" stroke="rgba(200,146,42,0.25)" stroke-width="0.5"/>
    <line x1="-50" y1="-65" x2="-50" y2="65" stroke="rgba(200,146,42,0.2)" stroke-width="0.5"/>
    <line x1="20" y1="-60" x2="20" y2="60" stroke="rgba(200,146,42,0.2)" stroke-width="0.5"/>
    <!-- Nav lights -->
    <circle cx="-220" cy="-85" r="3" fill="rgba(255,80,80,1)" filter="url(#avglow)"/>
    <circle cx="-220" cy="85" r="3" fill="rgba(50,255,80,1)" filter="url(#avglow)"/>
  </g>
</svg>
