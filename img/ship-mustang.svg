<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="mustangBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8922a"/>
      <stop offset="50%" stop-color="#8a6018"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,150,50,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,150,50,0)"/>
    </radialGradient>
    <filter id="mglow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <g transform="translate(300,160)">
    <!-- Engine glow -->
    <circle cx="180" cy="0" r="50" fill="url(#mGlow)"/>
    <!-- Sleek body -->
    <path d="M -240,-12 L -100,-30 L 80,-35 L 170,-15 L 195,0 L 170,15 L 80,35 L -100,30 L -240,12 Z" fill="url(#mustangBody)" stroke="rgba(255,200,100,0.6)" stroke-width="1.2"/>
    <!-- Top fin -->
    <polygon points="-30,-30 30,-70 70,-65 50,-30" fill="rgba(140,90,30,0.95)" stroke="rgba(255,200,100,0.5)" stroke-width="1"/>
    <!-- Cockpit forward -->
    <path d="M 30,-25 L 100,-25 L 130,-12 L 130,12 L 100,25 L 30,25 Z" fill="rgba(0,180,255,0.5)" stroke="rgba(0,220,255,0.9)" stroke-width="1.2"/>
    <ellipse cx="80" cy="-8" rx="30" ry="5" fill="rgba(180,230,255,0.7)"/>
    <!-- Side wings -->
    <polygon points="-50,-25 -160,-50 -200,-40 -130,-20" fill="rgba(110,75,25,0.95)" stroke="rgba(255,200,100,0.4)" stroke-width="1"/>
    <polygon points="-50,25 -160,50 -200,40 -130,20" fill="rgba(110,75,25,0.95)" stroke="rgba(255,200,100,0.4)" stroke-width="1"/>
    <!-- Wing engines -->
    <ellipse cx="-175" cy="-42" rx="14" ry="5" fill="rgba(20,28,40,1)" stroke="rgba(255,200,100,0.5)" stroke-width="0.8"/>
    <ellipse cx="-175" cy="42" rx="14" ry="5" fill="rgba(20,28,40,1)" stroke="rgba(255,200,100,0.5)" stroke-width="0.8"/>
    <!-- Main engine -->
    <rect x="150" y="-20" width="40" height="40" rx="4" fill="rgba(25,35,50,1)" stroke="rgba(255,200,100,0.6)" stroke-width="1"/>
    <circle cx="185" cy="-8" r="6" fill="rgba(255,170,60,1)" filter="url(#mglow)"/>
    <circle cx="185" cy="8" r="6" fill="rgba(255,170,60,1)" filter="url(#mglow)"/>
    <!-- Panel lines -->
    <line x1="-200" y1="0" x2="80" y2="0" stroke="rgba(255,200,100,0.25)" stroke-width="0.6"/>
    <!-- Decals -->
    <path d="M -80,-15 L -50,-15 L -40,0 L -50,15 L -80,15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <!-- Nav lights -->
    <circle cx="-160" cy="-40" r="2.5" fill="rgba(255,80,80,1)" filter="url(#mglow)"/>
    <circle cx="-160" cy="40" r="2.5" fill="rgba(50,255,80,1)" filter="url(#mglow)"/>
    <circle cx="180" cy="0" r="3.5" fill="rgba(255,180,60,1)" filter="url(#mglow)"/>
  </g>
</svg>
