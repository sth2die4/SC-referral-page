<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a2040"/>
      <stop offset="60%" stop-color="#050d1e"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(0,80,180,0.4)"/>
      <stop offset="100%" stop-color="rgba(0,80,180,0)"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="rgba(200,100,20,0.3)"/>
      <stop offset="100%" stop-color="rgba(200,100,20,0)"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b84a"/>
      <stop offset="100%" stop-color="#8a6018"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#nebula1)"/>
  <rect width="1200" height="630" fill="url(#nebula2)"/>

  <!-- Stars -->
  <g fill="#e8f0f8">
    <circle cx="100" cy="80" r="1.2" opacity="0.8"/>
    <circle cx="250" cy="150" r="0.8" opacity="0.6"/>
    <circle cx="400" cy="50" r="1.5" opacity="0.9"/>
    <circle cx="550" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="700" cy="200" r="1.1" opacity="0.7"/>
    <circle cx="850" cy="80" r="0.9" opacity="0.6"/>
    <circle cx="1000" cy="180" r="1.3" opacity="0.8"/>
    <circle cx="1100" cy="60" r="0.6" opacity="0.5"/>
    <circle cx="150" cy="400" r="1" opacity="0.7"/>
    <circle cx="350" cy="500" r="0.8" opacity="0.6"/>
    <circle cx="500" cy="550" r="1.4" opacity="0.9"/>
    <circle cx="800" cy="450" r="0.9" opacity="0.6"/>
    <circle cx="950" cy="520" r="1.1" opacity="0.7"/>
    <circle cx="1080" cy="380" r="0.7" opacity="0.5"/>
    <circle cx="80" cy="280" r="0.9" opacity="0.6"/>
    <circle cx="620" cy="380" r="1" opacity="0.7"/>
  </g>

  <!-- Planet right -->
  <circle cx="1050" cy="500" r="120" fill="#1a2840" opacity="0.6"/>
  <circle cx="1010" cy="470" r="120" fill="rgba(200,146,42,0.1)"/>

  <!-- Ship silhouette -->
  <g transform="translate(750,420)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="180" ry="35" fill="#00a8e8"/>
    <polygon points="0,-80 40,-10 0,-15 -40,-10" fill="#00a8e8"/>
    <rect x="-20" y="-15" width="40" height="30" rx="3" fill="#00a8e8"/>
    <ellipse cx="0" cy="5" rx="15" ry="7" fill="rgba(200,146,42,0.7)"/>
  </g>

  <!-- Badge -->
  <g transform="translate(80,80)">
    <rect width="240" height="36" rx="18" fill="rgba(200,146,42,0.15)" stroke="#c8922a" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#40c878"/>
    <text x="35" y="23" font-family="'Orbitron', sans-serif" font-size="11" fill="#f0b84a" letter-spacing="2.5">EXKLUSIVER BONUS</text>
  </g>

  <!-- Main title -->
  <text x="80" y="220" font-family="'Orbitron', sans-serif" font-size="68" font-weight="900" fill="#e8f0f8">
    Star Citizen
  </text>
  <text x="80" y="300" font-family="'Orbitron', sans-serif" font-size="68" font-weight="900" fill="url(#gold)" filter="url(#glow)">
    Startbonus
  </text>
  <text x="80" y="300" font-family="'Orbitron', sans-serif" font-size="68" font-weight="900" fill="url(#gold)">
    Startbonus
  </text>

  <!-- Bonus amount -->
  <g transform="translate(80,350)">
    <rect width="380" height="100" rx="8" fill="rgba(200,146,42,0.1)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <text x="24" y="35" font-family="'Orbitron', sans-serif" font-size="11" fill="#c8922a" letter-spacing="3">DEIN STARTBONUS</text>
    <text x="24" y="80" font-family="'Orbitron', sans-serif" font-size="42" font-weight="900" fill="#f0b84a">5.000 aUEC</text>
  </g>

  <!-- Code -->
  <g transform="translate(80,490)">
    <rect width="380" height="50" rx="6" fill="rgba(0,0,0,0.5)" stroke="rgba(0,168,232,0.4)" stroke-width="1"/>
    <text x="20" y="22" font-family="'Orbitron', sans-serif" font-size="10" fill="#7a96b0" letter-spacing="2.5">REFERRAL CODE</text>
    <text x="20" y="40" font-family="'Orbitron', sans-serif" font-size="18" font-weight="700" fill="#00a8e8" letter-spacing="2">STAR-VJ67-N2YG</text>
  </g>

  <!-- Logo top right -->
  <g transform="translate(1080,80)">
    <circle r="32" fill="none" stroke="#c8922a" stroke-width="2"/>
    <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="#c8922a"/>
  </g>
</svg>
