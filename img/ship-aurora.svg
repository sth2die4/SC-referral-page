<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="auroraBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6b80"/>
      <stop offset="50%" stop-color="#2a3548"/>
      <stop offset="100%" stop-color="#101620"/>
    </linearGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,200,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(0,200,255,0)"/>
    </radialGradient>
    <filter id="aGlow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g transform="translate(300,160)">
    <!-- Engine glow -->
    <circle cx="160" cy="0" r="40" fill="url(#auroraGlow)"/>
    <!-- Main fuselage -->
    <path d="M -220,-20 L -130,-50 L 100,-45 L 160,-20 L 180,0 L 160,20 L 100,45 L -130,50 L -220,20 Z" fill="url(#auroraBody)" stroke="rgba(200,146,42,0.5)" stroke-width="1.2"/>
    <!-- Top -->
    <path d="M -130,-50 L -40,-75 L 80,-70 L 130,-45 L 100,-45 L -110,-50 Z" fill="rgba(50,65,85,0.95)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <!-- Cockpit -->
    <ellipse cx="80" cy="-25" rx="35" ry="14" fill="rgba(0,180,255,0.5)" stroke="rgba(0,200,255,0.8)" stroke-width="1.2"/>
    <ellipse cx="85" cy="-28" rx="20" ry="6" fill="rgba(180,230,255,0.7)"/>
    <!-- Wings -->
    <polygon points="-40,-50 -100,-100 -160,-90 -120,-50" fill="rgba(40,55,75,0.95)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <polygon points="-40,50 -100,100 -160,90 -120,50" fill="rgba(40,55,75,0.95)" stroke="rgba(200,146,42,0.4)" stroke-width="1"/>
    <!-- Engines -->
    <rect x="130" y="-30" width="50" height="60" rx="6" fill="rgba(20,28,40,1)" stroke="rgba(200,146,42,0.5)" stroke-width="1"/>
    <circle cx="170" cy="-15" r="7" fill="rgba(0,220,255,1)" filter="url(#aGlow)"/>
    <circle cx="170" cy="15" r="7" fill="rgba(0,220,255,1)" filter="url(#aGlow)"/>
    <!-- Panel lines -->
    <line x1="-180" y1="0" x2="100" y2="0" stroke="rgba(200,146,42,0.25)" stroke-width="0.6"/>
    <line x1="-50" y1="-50" x2="-50" y2="50" stroke="rgba(200,146,42,0.2)" stroke-width="0.5"/>
    <line x1="20" y1="-50" x2="20" y2="50" stroke="rgba(200,146,42,0.2)" stroke-width="0.5"/>
    <!-- Nav lights -->
    <circle cx="-140" cy="-90" r="2.5" fill="rgba(200,146,42,1)" filter="url(#aGlow)"/>
    <circle cx="-140" cy="90" r="2.5" fill="rgba(200,146,42,1)" filter="url(#aGlow)"/>
    <circle cx="160" cy="0" r="3.5" fill="rgba(255,80,80,0.9)" filter="url(#aGlow)"/>
    <!-- Underglow -->
    <ellipse cx="-30" cy="55" rx="160" ry="4" fill="rgba(0,168,232,0.25)" filter="url(#aGlow)"/>
  </g>
</svg>
